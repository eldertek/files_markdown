name: Node CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - stable*

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: npm install
        run: npm ci --ignore-scripts
      - name: npm build
        run: npm run build
